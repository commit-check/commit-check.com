<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Commit Check logo">
  <!-- A commit on a history line, checked. The tile is a step lighter than the
       header so the mark still reads as a tile on the ink header. -->
  <rect width="64" height="64" rx="15" fill="#13212C"/>
  <path d="M21 10V54" stroke="#2C9CCD" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>
  <path d="M21 34L30 43L47 22" fill="none" stroke="#2C9CCD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21" cy="34" r="6.5" fill="#13212C" stroke="#2C9CCD" stroke-width="4"/>
</svg>
