site_name: Commit Check
# Deploy previews override this so the preview is self-consistent; see
# netlify.toml.
site_url: !ENV [SITE_URL, 'https://commit-check.com/']
site_description: >-
  Commit policy as code for teams and AI agents: commit message, branch
  naming, author and sign-off standards in one config file, enforced in
  hooks, CI and pull requests.
site_author: shenxianpeng
copyright: Copyright &copy; 2022 - 2026 Commit Check

# The header links to the product repository, not to this documentation repo:
# visitors who reach the site from a search or a link are users of commit-check
# itself, and the star/fork counts and the "star" entry point belong to it. The
# pages themselves live here, so edit_uri is an absolute URL pointing back at
# this repository.
repo_url: https://github.com/commit-check/commit-check
repo_name: commit-check/commit-check
edit_uri: https://github.com/commit-check/commit-check.com/edit/main/docs/

docs_dir: docs

# The deploy workflow builds with --strict, which turns these into errors. The
# pages cross-link by section anchor rather than by page alone, and an anchor
# that no longer exists is invisible in a rendered page — it just scrolls to the
# top. Failing the build is the only way that gets noticed.
validation:
  unrecognized_links: warn
  anchors: warn

theme:
  name: sumi
  locale: en
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  # Follows the system on the first visit; the header toggle then switches
  # between light and dark and remembers the choice.
  palette: auto
  # Signal Blue, the brand accent (see assets/extra.css for the full palette).
  accent: "#2c9ccd"
  # Navigation lives in the left sidebar, grouped into sections, not in
  # header tabs.
  navigation_tabs: false
  # The preview image for pages that do not set their own `image:`.
  social_image: assets/social.png

extra_css:
  # Brand colours and typography. The landing page adds its own layout in
  # overrides/landing.html.
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/commit-check
      name: Commit Check on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/commit-check/
      name: commit-check on PyPI
  analytics:
    provider: google
    property: G-TSR5L4JL2V

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # llms.txt at the site root, listing the Markdown copy of every page, and
  # llms-full.txt with all of them in one file, for agents that read the docs.
  # Built from the pages, so nothing to keep up to date by hand.
  - llms_txt:
      full_output: true
  # Sumi's plugin: components, the blog (index, tags, Atom feed) under
  # docs/blog/, and a Markdown copy of each page.
  - sumi

hooks:
  - scripts/mkdocs_hooks.py

# Grouped by what the reader is doing. "Where to run it" answers the first
# question a reader has — hook, Action or App, and how they combine — so it sits
# on its own, right after Getting started. Guides are pages you follow to get
# something done, one per place the checks run; Reference is what you look a
# fact up in; Compare is for readers weighing Commit Check against something
# else. The pages are ordered within each group by how often they are needed.
#
# The guides once lived on a single Integrations page. They were split again
# when the App's section outgrew it; the old per-page URLs came back with them.
#
# There was a third group, "About", holding migration, troubleshooting and the
# changelog — none of which is about the project. Troubleshooting was the
# problem: it is the page you want when a build has just gone red, and nobody
# looks under "About" for that. It has exactly one inbound link in the whole
# site, so the nav was doing nearly all the work of making it findable.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Where to run it: guides/integrations.md
  - Guides:
      - Pre-commit hook: guides/pre-commit.md
      - GitHub Action: guides/github-actions.md
      - GitHub App: guides/github-app.md
      - GitLab, Bitbucket, Azure: guides/other-ci.md
      - With release tools: guides/release-tools.md
      - Across an organization: guides/organization.md
      - MCP server: guides/mcp.md
      - Python API: guides/python-api.md
      - Policy guides: guides/policies.md
      - Command-line recipes: example.md
      - Troubleshooting: troubleshoot.md
      - Migrating from v1: migration.md
  - Reference:
      - Rules: rules.md
      - Configuration: configuration.md
      - Changelog: changelog.md
      - Privacy: privacy.md
      - Terms of Service: terms.md
  - Compare:
      - GitHub's built-in rules: compare/github-rules.md
      - Other tools: compare/tools.md
  - Blog:
      - blog/index.md
